name: web_pos_mobile
description: "Aplikasi kasir Kasir Toko untuk HP dan tablet."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.21
  uuid: ^4.6.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  cached_network_image: ^4.0.4
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  print_bluetooth_thermal: ^1.2.5
  esc_pos_utils_plus: ^2.0.4
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  package_info_plus: ^10.2.2
  wakelock_plus: ^1.8.1
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/splash.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#059669"
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#020617"
  image: assets/icon/splash.png
  android_12:
    color: "#020617"
    image: assets/icon/splash.png
