name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Split APKs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test --no-pub --dart-define=HOSTED=true

      - name: Configure Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=${GITHUB_WORKSPACE}/android/app/upload.jks
          EOF

      - name: Build Split APKs
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          RAW_VERSION="${TAG_NAME#v}"
          if [[ "$RAW_VERSION" =~ ^([^+]+)\+(.+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            BUILD_NUMBER="${BASH_REMATCH[2]}"
          else
            VERSION_NAME="$RAW_VERSION"
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi

          echo "Building APK for Version: $VERSION_NAME, Build: $BUILD_NUMBER (HOSTED=true)"
          flutter build apk --release --split-per-abi --dart-define=HOSTED=true --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"

      - name: Rename and Package APKs
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          mkdir -p release-apks

          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            filename=$(basename "$apk")
            abi=$(echo "$filename" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            target_name="kasirtoko-${TAG_NAME}-${abi}.apk"
            cp "$apk" "release-apks/${target_name}"
            echo "Renamed: $filename -> $target_name"
          done

          cd release-apks
          sha256sum *.apk > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt
          cd ..

      - name: Clean sensitive credentials
        if: always()
        run: |
          rm -f android/app/upload.jks android/key.properties

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kasirtoko-${{ github.ref_name }}-apks
          path: release-apks/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          gh release create "$TAG_NAME" release-apks/* \
            --title "Kasir Toko Mobile $TAG_NAME" \
            --notes "### Release Kasir Toko Mobile \`$TAG_NAME\`

          File APK telah di-build dengan arsitektur split-per-abi untuk ukuran file yang lebih optimal:
          - **\`kasirtoko-${TAG_NAME}-arm64-v8a.apk\`**: Mayoritas smartphone Android modern (64-bit).
          - **\`kasirtoko-${TAG_NAME}-armeabi-v7a.apk\`**: Smartphone Android generasi lama (32-bit).
          - **\`kasirtoko-${TAG_NAME}-x86_64.apk\`**: Emulator & perangkat Chromebook/Intel/AMD 64-bit.

          Checksum integritas file tersedia di \`checksums.txt\`."
